# Optional drop-in: /etc/systemd/system/dnsp-modern.service.d/port-53.conf
# Choose the addresses and bootstrap address for your deployment before enabling.
[Service]
ExecStart=
ExecStart=/usr/bin/dnsp-modern -l 127.0.0.1 -l ::1 -p 53 --bootstrap-address 1.1.1.1 -m 9153
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
