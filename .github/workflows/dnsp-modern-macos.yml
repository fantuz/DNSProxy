name: DNSProxy modern - native macOS

"on":
  workflow_dispatch:
    inputs:
      measure_build:
        description: Compare Apple Silicon build profiles
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      measure_build:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Build and bundle the shared C resolver
        if: matrix.arch != 'arm64' || !inputs.measure_build
        run: bash scripts/build-macos.sh
      - name: Measure and build the Apple Silicon release
        if: matrix.arch == 'arm64' && inputs.measure_build
        run: python3 scripts/measure-macos-build.py
      - name: Extract and verify the release archive
        run: |
          portable="$RUNNER_TEMP/DNSProxy portable bundle"
          mkdir -p "$portable"
          tar -xzf "dist/dnsp-modern-$(cat VERSION)-macos-${{ matrix.arch }}.tar.gz" -C "$portable"
          (cd "$portable" && shasum -a 256 -c SHA256SUMS)
          codesign --verify --deep --strict "$portable/DNSProxy.app"
          codesign --verify --strict "$portable/dnsp-modern"
          codesign --verify --strict "$portable/dnsp-macos"
          "$portable/dnsp-modern" --version
      - name: Install protocol fixtures and configure loopback test addresses
        run: |
          python3 -m pip install -r ci/requirements-http2.txt
          for n in 2 3 4 5 6; do sudo ifconfig lo0 alias "127.0.0.$n" up; done
      - name: Install optional Homebrew desktop dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install gtk4 pygobject3
          brew list --versions > dist/macos-gui-runtime.txt
      - name: Test the packaged launcher and native GTK interface
        env:
          GDK_BACKEND: macos
          GSK_RENDERER: cairo
        run: |
          portable="$RUNNER_TEMP/DNSProxy portable bundle"
          export DNSP_TEST_BINARY="$portable/dnsp-modern"
          export DNSP_GUI_SOURCE="$portable/gui"
          "$portable/gui/dnsp-gui-macos" --python-check tests/test_gui_macos_launcher.py -v
          "$portable/gui/dnsp-gui-macos" --python-check tests/test_gui_platforms.py -v
          "$portable/gui/dnsp-gui-macos" --python-check tests/test_gui_process.py -v
          "$portable/gui/dnsp-gui-macos" --python-check tests/test_gui_settings.py -v
          "$portable/gui/dnsp-gui-macos" --python-check tests/test_gui_telemetry.py -v
          # Exercise GTK and resolver process controls from inside the sealed Finder bundle.
          export DNSP_TEST_BINARY="$portable/DNSProxy.app/Contents/Helpers/dnsp-modern"
          export DNSP_GUI_SOURCE="$portable/DNSProxy.app/Contents/Resources/gui"
          export PYTHONDONTWRITEBYTECODE=1
          "$portable/gui/dnsp-gui-macos" --python-check tests/test_gui_native.py \
            --binary "$DNSP_TEST_BINARY" --artifacts "$PWD/dist/gui-native-macos-${{ matrix.arch }}"
      - name: Test the extracted CLI, launchd service and protocols
        env:
          DNSP_REQUIRE_IPV6: '1'
        run: |
          portable="$RUNNER_TEMP/DNSProxy portable bundle"
          export DNSP_TEST_BINARY="$portable/dnsp-modern"
          failed=0
          python3 tests/test_host_capabilities.py -v || failed=1
          sudo dist/macos-dns-tests || failed=1
          sudo env DNSP_TEST_BINARY="$DNSP_TEST_BINARY" "$(command -v python3)" tests/test_macos_service.py -v || failed=1
          dist/macos-platform || { echo "::error::Socket probe failed (exit $?)"; failed=1; }
          dist/macos-curl_callbacks || { echo "::error::Callback probe failed (exit $?)"; failed=1; }
          python3 tests/test_modern.py -v || failed=1
          python3 tests/test_hedging.py -v || failed=1
          python3 tests/test_policy.py -v || failed=1
          python3 tests/test_policy_updater.py -v || failed=1
          python3 tests/test_ipv6.py -v || failed=1
          python3 -m unittest discover -s tests -p test_benchmark.py -v || failed=1
          python3 tests/test_macos.py -v || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dnsp-modern-macos-${{ matrix.arch }}
          path: |
            dist/dnsp-modern-*-macos-${{ matrix.arch }}.tar.gz
            dist/dnsp-modern-*-macos-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native desktop evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dnsp-macos-gui-evidence-${{ matrix.arch }}
          path: |
            dist/macos-gui-runtime.txt
            dist/gui-native-macos-${{ matrix.arch }}/
            dist/macos-build-${{ matrix.arch }}*.json
            dist/macos-build-${{ matrix.arch }}*.log
            dist/macos-build-${{ matrix.arch }}*.time
          if-no-files-found: warn
          retention-days: 14
