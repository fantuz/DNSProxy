name: CodeQL

"on":
  push:
    branches: [master]
    paths: [dnsp-modern.c, modern.mk, .github/workflows/codeql.yml]
  pull_request:
    branches: [master]
    paths: [dnsp-modern.c, modern.mk, .github/workflows/codeql.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze dnsp-modern (C)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build dnsp-modern
        run: make -B -f modern.mk dnsp-modern
      - uses: github/codeql-action/analyze@v4
