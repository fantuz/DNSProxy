name: DNSProxy modern - native Windows PoC

"on":
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  native-windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            compiler: gcc
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
            compiler: clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          # QUIC fixture dependencies do not all publish Windows ARM64 wheels.
          # Only this test driver uses emulation; the product/probes stay ARM64.
          architecture: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            ${{ matrix.prefix }}-${{ matrix.compiler }}
            ${{ matrix.prefix }}-curl
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-python
      - name: Build and bundle the shared C source
        id: build
        shell: msys2 {0}
        run: bash scripts/build-windows.sh
      - name: Install protocol test fixtures
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: 'hypercorn==0.18.0' 'h2==4.3.0' 'aioquic==1.3.0'
      - name: Test the portable bundle without MSYS2 on PATH
        shell: pwsh
        env:
          DNSP_REQUIRE_IPV6: '1'
          DNSP_TEST_OPENSSL: ${{ steps.build.outputs.openssl }}
          DNSP_TEST_WINDOWS_ARCH: ${{ matrix.arch }}
        run: |
          $python = (Get-Command python).Source
          $address = Get-NetIPAddress -AddressFamily IPv4 | Where-Object {
            $_.AddressState -eq 'Preferred' -and $_.IPAddress -notmatch '^(127\.|169\.254\.)'
          } | Select-Object -First 1
          if (-not $address) { throw 'An assigned secondary IPv4 address is required for wildcard tests' }
          $env:DNSP_TEST_SECOND_ADDRESS = $address.IPAddress
          $portable = Join-Path $env:RUNNER_TEMP 'DNSProxy portable bundle'
          $archive = (Get-ChildItem dist/dnsp-modern-*-windows-${{ matrix.arch }}-poc.zip).FullName
          Expand-Archive -Path $archive -DestinationPath $portable
          Copy-Item dist/platform-probe.exe $portable
          Copy-Item dist/service-fixture.exe $portable
          $env:DNSP_TEST_BINARY = Join-Path $portable 'dnsp-modern.exe'
          $env:Path = "$(Split-Path $python);$env:SystemRoot\System32;$env:SystemRoot"
          & (Join-Path $portable 'platform-probe.exe')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $env:DNSP_TEST_BINARY --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem packaging/windows/* -Include *.ps1,*.psm1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw $errors }
          }
          $failed = $false
          & $python tests/test_host_capabilities.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_windows_bundle.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_modern.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_hedging.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_policy.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_policy_updater.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_ipv6.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_windows.py -v
          if ($LASTEXITCODE) { $failed = $true }
          $savedModulePath = $env:PSModulePath
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/test_windows_dns.ps1
          if ($LASTEXITCODE) { $failed = $true }
          $env:PSModulePath = $savedModulePath
          & $python tests/test_windows_service.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python -m unittest discover -s tests -p test_benchmark.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_http3.py -v
          if ($LASTEXITCODE) { $failed = $true }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v6
        with:
          name: dnsp-modern-windows-${{ matrix.arch }}-poc
          path: |
            dist/dnsp-modern-*-windows-${{ matrix.arch }}-poc.zip
            dist/dnsp-modern-*-windows-${{ matrix.arch }}-poc.zip.sha256
          if-no-files-found: error
          retention-days: 14
