name: DNSProxy modern - native Windows PoC

"on":
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
      - name: Build and bundle the shared C source
        id: build
        shell: msys2 {0}
        run: bash scripts/build-windows.sh
      - name: Install protocol test fixtures
        shell: pwsh
        run: python -m pip install 'hypercorn==0.18.0' 'h2==4.3.0' 'aioquic==1.3.0'
      - name: Test the portable bundle without MSYS2 on PATH
        shell: pwsh
        env:
          DNSP_REQUIRE_IPV6: '1'
          DNSP_TEST_OPENSSL: ${{ steps.build.outputs.openssl }}
        run: |
          $python = (Get-Command python).Source
          $address = Get-NetIPAddress -AddressFamily IPv4 | Where-Object {
            $_.AddressState -eq 'Preferred' -and $_.IPAddress -notmatch '^(127\.|169\.254\.)'
          } | Select-Object -First 1
          if (-not $address) { throw 'An assigned secondary IPv4 address is required for wildcard tests' }
          $env:DNSP_TEST_SECOND_ADDRESS = $address.IPAddress
          $portable = Join-Path $env:RUNNER_TEMP 'DNSProxy portable bundle'
          $archive = (Get-ChildItem dist/dnsp-modern-*-windows-amd64-poc.zip).FullName
          Expand-Archive -Path $archive -DestinationPath $portable
          Copy-Item dist/platform-probe.exe $portable
          $env:DNSP_TEST_BINARY = Join-Path $portable 'dnsp-modern.exe'
          $env:Path = "$(Split-Path $python);$env:SystemRoot\System32;$env:SystemRoot"
          & (Join-Path $portable 'platform-probe.exe')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $env:DNSP_TEST_BINARY --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem packaging/windows/*.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw $errors }
          }
          $failed = $false
          & $python tests/test_modern.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_ipv6.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_windows.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_windows_service.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python -m unittest discover -s tests -p test_benchmark.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_http3.py -v
          if ($LASTEXITCODE) { $failed = $true }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v6
        with:
          name: dnsp-modern-windows-amd64-poc
          path: |
            dist/dnsp-modern-*-windows-amd64-poc.zip
            dist/dnsp-modern-*-windows-amd64-poc.zip.sha256
          if-no-files-found: error
          retention-days: 14
