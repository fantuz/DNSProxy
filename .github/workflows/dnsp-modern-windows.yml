name: DNSProxy modern - native Windows

"on":
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  native-windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            compiler: gcc
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
            compiler: clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # Pin the test driver independently of the native product architecture.
      DNSP_PYTHON_VERSION: '3.13.17'
      MSYSTEM: ${{ matrix.msystem }}
      MSYS2_PATH_TYPE: minimal
      CHERE_INVOKING: '1'
      DNSP_PACKAGE_PREFIX: ${{ matrix.prefix }}
      DNSP_COMPILER: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Select the toolchain refresh window
        id: cache-epoch
        shell: pwsh
        run: |
          "week=$([Math]::Floor([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() / 604800))" >> $env:GITHUB_OUTPUT
          # Runner-provided variables are read in the shell, not the YAML env context.
          $image = if ($env:ImageVersion) { $env:ImageVersion } else { [Environment]::OSVersion.Version.ToString() }
          "image=$image" >> $env:GITHUB_OUTPUT
      - name: Restore the x64 test Python on ARM64 runners
        if: matrix.arch == 'arm64'
        id: python-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/Python/${{ env.DNSP_PYTHON_VERSION }}/x64
            ${{ runner.tool_cache }}/Python/${{ env.DNSP_PYTHON_VERSION }}/x64.complete
          key: dnsp-python-v1-${{ matrix.runner }}-${{ steps.cache-epoch.outputs.image }}-x64-${{ env.DNSP_PYTHON_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.DNSP_PYTHON_VERSION }}
          # QUIC fixture dependencies do not all publish Windows ARM64 wheels.
          # Only this test driver uses emulation; the product/probes stay ARM64.
          architecture: x64
      - name: Verify the test interpreter
        shell: pwsh
        run: |
          python -c "import struct,sys,sysconfig; assert sys.version.split()[0] == '${{ env.DNSP_PYTHON_VERSION }}'; assert struct.calcsize('P') == 8; assert sysconfig.get_platform() == 'win-amd64'; print(sys.executable)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Save the bare x64 test Python
        if: matrix.arch == 'arm64' && steps.python-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/Python/${{ env.DNSP_PYTHON_VERSION }}/x64
            ${{ runner.tool_cache }}/Python/${{ env.DNSP_PYTHON_VERSION }}/x64.complete
          key: ${{ steps.python-cache.outputs.cache-primary-key }}
      - name: Restore the prepared MSYS2 toolchain
        if: github.event_name == 'pull_request'
        id: msys-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msys64
          key: dnsp-msys-v1-${{ matrix.runner }}-${{ matrix.msystem }}-${{ steps.cache-epoch.outputs.image }}-${{ steps.cache-epoch.outputs.week }}-${{ hashFiles('.github/workflows/dnsp-modern-windows.yml') }}
      - name: Validate the restored toolchain or use a clean installation
        id: msys-check
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.msys-cache.outputs.cache-hit }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'msys64'
          $ready = $env:CACHE_HIT -eq 'true' -and (Test-Path "$root/usr/bin/bash.exe")
          if ($ready) {
            & "$root/usr/bin/bash.exe" -leo pipefail -c 'pacman -Q git "${DNSP_PACKAGE_PREFIX}-${DNSP_COMPILER}" "${DNSP_PACKAGE_PREFIX}-curl" "${DNSP_PACKAGE_PREFIX}-pkgconf" "${DNSP_PACKAGE_PREFIX}-python" >/dev/null && "$DNSP_COMPILER" --version && pkg-config --modversion libcurl && python --version'
            $ready = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
          }
          if (-not $ready -and (Test-Path $root)) { Remove-Item -Recurse -Force $root }
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        if: steps.msys-check.outputs.ready != 'true'
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            ${{ matrix.prefix }}-${{ matrix.compiler }}
            ${{ matrix.prefix }}-curl
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-python
      - name: Build and bundle the shared C source
        id: build
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/msys64/usr/bin/bash.exe" -leo pipefail -c 'bash scripts/build-windows.sh'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compare the released Windows transport packages with this week's build
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DNSP_ARCH: ${{ matrix.arch }}
        run: |
          $tag = gh release view --json tagName --jq .tagName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $old = Join-Path $env:RUNNER_TEMP 'released-transport'
          gh release download $tag --pattern "dnsp-modern-*-windows-$env:DNSP_ARCH-poc.zip" --dir $old
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = (Get-ChildItem $old -Filter '*.zip').FullName
          Expand-Archive -LiteralPath $archive -DestinationPath "$old/extracted"
          $pattern = "^$env:DNSP_PACKAGE_PREFIX-(curl|openssl|nghttp2|nghttp3|ngtcp2) "
          $oldVersions = @(Get-Content "$old/extracted/BUILD-INFO.txt" | Where-Object { $_ -match $pattern })
          $newVersions = @(Get-Content dist/windows/BUILD-INFO.txt | Where-Object { $_ -match $pattern })
          if (-not ($oldVersions -match '-curl ') -or -not ($newVersions -match '-curl ')) {
            throw 'The Windows package inventory is missing libcurl.'
          }
          "### Windows $env:DNSP_ARCH transport packages compared with $tag" >> $env:GITHUB_STEP_SUMMARY
          $changes = Compare-Object $oldVersions $newVersions
          if ($changes) {
            Write-Output "::warning::Windows $env:DNSP_ARCH transport packages differ from $tag. Review the next DNSProxy release."
            foreach ($change in $changes) {
              $which = if ($change.SideIndicator -eq '=>') { 'Fresh build' } else { 'Published' }
              "- $which — $($change.InputObject)" >> $env:GITHUB_STEP_SUMMARY
            }
          } else {
            'The tracked package revisions match.' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Save the prepared toolchain after a successful native build
        if: github.event_name == 'pull_request' && steps.msys-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msys64
          key: ${{ steps.msys-cache.outputs.cache-primary-key }}
      - name: Cache Windows protocol fixture downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/pip/Cache
          key: dnsp-pip-v1-${{ matrix.runner }}-x64-${{ env.DNSP_PYTHON_VERSION }}-${{ hashFiles('ci/requirements-*.txt') }}
      - name: Install protocol test fixtures
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r ci/requirements-protocol.txt
      - name: Measure native resolver CPU on cached and uncached queries
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        shell: pwsh
        env:
          DNSP_TEST_OPENSSL: ${{ steps.build.outputs.openssl }}
        run: |
          $candidate = (Resolve-Path dist/windows/dnsp-modern.exe).Path
          $builds = @('--dnsp', $candidate)
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $coreChanges = git diff --name-only HEAD^1 HEAD -- dnsp-modern.c dnsp-platform.h dnsp-service.h dnsp-policy.h
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if (-not $coreChanges) { exit 0 }
            $baseline = Join-Path $env:RUNNER_TEMP 'dnsp-cpu-baseline'
            git worktree add --detach $baseline HEAD^1
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & "$env:RUNNER_TEMP/msys64/usr/bin/bash.exe" -leo pipefail -c 'cd "$(cygpath -u "$RUNNER_TEMP")/dnsp-cpu-baseline" && GITHUB_OUTPUT= bash scripts/build-windows.sh'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $builds = @('--dnsp', (Join-Path $baseline 'dist/windows/dnsp-modern.exe'), '--candidate', $candidate)
          }
          $report = 'dist/windows-test-logs/forwarder-cpu'
          python bench/compare_resolvers.py @builds --clients 1 32 --workloads miss hit --runs 4 --warmup 0.5 --duration 2 --output $report
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content "$report/summary.md" -Encoding utf8 >> $env:GITHUB_STEP_SUMMARY
      - name: Test the portable bundle without MSYS2 on PATH
        shell: pwsh
        env:
          DNSP_REQUIRE_IPV6: '1'
          DNSP_TEST_OPENSSL: ${{ steps.build.outputs.openssl }}
          DNSP_TEST_WINDOWS_ARCH: ${{ matrix.arch }}
        run: |
          $python = (Get-Command python).Source
          $address = Get-NetIPAddress -AddressFamily IPv4 | Where-Object {
            $_.AddressState -eq 'Preferred' -and $_.IPAddress -notmatch '^(127\.|169\.254\.)'
          } | Select-Object -First 1
          if (-not $address) { throw 'An assigned secondary IPv4 address is required for wildcard tests' }
          $env:DNSP_TEST_SECOND_ADDRESS = $address.IPAddress
          $portable = Join-Path $env:RUNNER_TEMP 'DNSProxy portable bundle'
          $archive = (Get-ChildItem dist/dnsp-modern-*-windows-${{ matrix.arch }}-poc.zip).FullName
          Expand-Archive -Path $archive -DestinationPath $portable
          Copy-Item dist/platform-probe.exe $portable
          Copy-Item dist/service-fixture.exe $portable
          $env:DNSP_TEST_BINARY = Join-Path $portable 'dnsp-modern.exe'
          $env:Path = "$(Split-Path $python);$env:SystemRoot\System32;$env:SystemRoot"
          & (Join-Path $portable 'platform-probe.exe')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $env:DNSP_TEST_BINARY --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem packaging/windows/* -Include *.ps1,*.psm1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw $errors }
          }
          $failed = $false
          & $python tests/test_host_capabilities.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_windows_bundle.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_ci_parallel.py -v
          if ($LASTEXITCODE) { $failed = $true }
          & $python scripts/run-windows-tests.py --workers 2
          if ($LASTEXITCODE) { $failed = $true }
          & $python tests/test_windows.py -v
          if ($LASTEXITCODE) { $failed = $true }
          $savedModulePath = $env:PSModulePath
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/test_windows_dns.ps1
          if ($LASTEXITCODE) { $failed = $true }
          $env:PSModulePath = $savedModulePath
          & $python tests/test_windows_service.py -v
          if ($LASTEXITCODE) { $failed = $true }
          if ($failed) { exit 1 }
      - name: Compile the matching standard installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Architecture '${{ matrix.arch }}'
      - name: Test the setup wizard and real service install, upgrade and uninstall
        shell: pwsh
        env:
          DNSP_TEST_WINDOWS_ARCH: ${{ matrix.arch }}
          DNSP_TEST_OPENSSL: ${{ steps.build.outputs.openssl }}
        run: |
          $python = (Get-Command python).Source
          $env:DNSP_TEST_INSTALLER = (Get-ChildItem dist/dnsp-modern-*-windows-${{ matrix.arch }}-setup.exe).FullName
          $env:DNSP_TEST_BINARY = "$pwd/dist/windows/dnsp-modern.exe"
          $env:Path = "$(Split-Path $python);$env:SystemRoot\System32;$env:SystemRoot"
          & $python tests/test_windows_installer.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dnsp-modern-windows-${{ matrix.arch }}-poc
          path: |
            dist/dnsp-modern-*-windows-${{ matrix.arch }}-poc.zip
            dist/dnsp-modern-*-windows-${{ matrix.arch }}-poc.zip.sha256
            dist/dnsp-modern-*-windows-${{ matrix.arch }}-setup.exe
            dist/dnsp-modern-*-windows-${{ matrix.arch }}-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Save per-suite test logs and timings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dnsp-windows-test-logs-${{ matrix.arch }}
          path: dist/windows-test-logs/
          if-no-files-found: warn
          retention-days: 7
      - name: Save installer logs and wizard evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dnsp-windows-installer-evidence-${{ matrix.arch }}
          path: dist/windows-installer-evidence/
          if-no-files-found: warn
          retention-days: 14
