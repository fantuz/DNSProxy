name: DNSProxy modern - parser fuzzing

"on":
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  parser-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang and libcurl development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev libcurl4-openssl-dev pkg-config
      - name: Fuzz DNS wire and HTTP cache parsers
        run: make -f modern.mk modern-fuzz FUZZ_CC=/usr/bin/clang
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: dnsp-parser-fuzz-reproducer
          path: |
            crash-*
            timeout-*
            leak-*
            oom-*
          if-no-files-found: ignore
          retention-days: 7
