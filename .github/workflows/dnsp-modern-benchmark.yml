name: DNSProxy modern - HTTP2 benchmark and HTTP3 smoke

"on":
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  synthetic-h2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install compiler, curl and Python venv
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev curl python3-venv openssl iproute2
      - name: Install benchmark server dependencies in isolated venv
        run: |
          python3 -m venv .bench-venv
          .bench-venv/bin/python -m pip install 'hypercorn==0.18.0' 'h2==4.3.0'
      - name: Compile and run loopback TLS/ALPN smoke
        run: |
          make -f modern.mk dnsp-modern
          .bench-venv/bin/python -m unittest discover -s tests -p 'test_benchmark.py' -v
          if ! /usr/bin/curl --version | grep -q '^Features:.* HTTP3'; then
            status=0
            timeout 3 ./dnsp-modern --upstream-http=prefer-h3 2>http3-unsupported.log || status=$?
            test "$status" -eq 2
            grep -F 'requires libcurl with HTTP/3 support' http3-unsupported.log
          fi
      - name: Run reproducible short two-protocol comparison
        run: |
          mkdir -p dist
          .bench-venv/bin/python bench/bench_modern.py \
            --protocol both --concurrency 1,8,32 --warmup 0.3 --duration 1 \
            --max-host-connections 1 --assert-h2-multiplex \
            --output dist/bench-ci.json
      - name: Measure constrained streams over a lossy upstream link
        run: |
          sudo sh bench/netem.sh 5ms 1% .bench-venv/bin/python \
            --protocol h2 --concurrency 16 --warmup 0.5 --duration 2 \
            --h2-max-streams 8 --max-host-connections 2 --assert-h2-multiplex \
            --output dist/bench-ci-netem.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dnsp-modern-benchmark-smoke
          path: dist/bench-ci*.*
          if-no-files-found: warn
          retention-days: 7

  synthetic-h3:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build the Debian 13 benchmark image
        run: |
          docker build --tag dnsp-modern-h3-ci --file - . <<'DOCKERFILE'
          FROM debian:13-slim
          RUN apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config \
              libcurl4-openssl-dev python3-venv openssl ca-certificates iproute2 && \
              rm -rf /var/lib/apt/lists/*
          RUN python3 -m venv /opt/bench && /opt/bench/bin/python -m pip install \
              'hypercorn==0.18.0' 'h2==4.3.0' 'aioquic==1.3.0'
          WORKDIR /src
          COPY dnsp-modern.c dnsp-platform.h dnsp-service.h modern.mk VERSION ./
          COPY bench/ bench/
          COPY tests/ tests/
          RUN make -f modern.mk dnsp-modern
          DOCKERFILE
      - name: Verify HTTP/3 negotiation and TCP fallback
        run: docker run --rm --network none dnsp-modern-h3-ci /opt/bench/bin/python tests/test_http3.py
      - name: Compare HTTP/2 and HTTP/3 over an impaired upstream link
        run: |
          mkdir -p dist
          sudo modprobe sch_netem
          docker run --rm --network none --cap-add NET_ADMIN -v "$PWD/dist:/results" \
            dnsp-modern-h3-ci sh bench/netem.sh --isolated 5ms 0.5% /opt/bench/bin/python \
            --protocol h2-h3 --concurrency 16 --warmup 0.6 --duration 2 \
            --output /results/bench-ci-h2-h3-netem.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dnsp-modern-h2-h3-netem
          path: dist/bench-ci-h2-h3-netem.*
          if-no-files-found: warn
          retention-days: 7
