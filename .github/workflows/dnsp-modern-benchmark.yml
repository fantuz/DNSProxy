name: DNSProxy modern - HTTP2 benchmark and HTTP3 smoke

"on":
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  synthetic-h2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install compiler, curl and Python venv
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev curl python3-venv openssl iproute2
      - name: Cache Linux HTTP2 fixture downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: dnsp-pip-v1-${{ runner.os }}-${{ runner.arch }}-system-http2-${{ hashFiles('ci/requirements-*.txt') }}
      - name: Install benchmark server dependencies in isolated venv
        run: |
          python3 -m venv .bench-venv
          .bench-venv/bin/python -m pip install -r ci/requirements-http2.txt
      - name: Compile and run loopback TLS/ALPN smoke
        run: |
          make -f modern.mk dnsp-modern
          .bench-venv/bin/python -m unittest discover -s tests -p 'test_benchmark.py' -v
          if ! /usr/bin/curl --version | grep -q '^Features:.* HTTP3'; then
            status=0
            timeout 3 ./dnsp-modern --upstream-http=prefer-h3 2>http3-unsupported.log || status=$?
            test "$status" -eq 2
            grep -F 'requires libcurl with HTTP/3 support' http3-unsupported.log
          fi
      - name: Run reproducible short two-protocol comparison
        run: |
          mkdir -p dist
          .bench-venv/bin/python bench/bench_modern.py \
            --protocol both --concurrency 1,8,32 --warmup 0.3 --duration 1 \
            --max-host-connections 1 --assert-h2-multiplex \
            --output dist/bench-ci.json
      - name: Verify DNS replies and upstream counts across three local forwarders
        run: |
          peers="$RUNNER_TEMP/doh-peers"
          bench/fetch-comparison-peers.sh "$peers"
          .bench-venv/bin/python bench/compare_resolvers.py \
            --adguard "$peers/dnsproxy" --dnscrypt "$peers/dnscrypt-proxy" \
            --runs 1 --clients 1 8 --workloads miss hit --duration 0.5 --warmup 0.25 --output dist/bench-ci-comparison
      - name: Measure constrained streams over a lossy upstream link
        run: |
          sudo sh bench/netem.sh 5ms 1% .bench-venv/bin/python \
            --protocol h2 --concurrency 16 --warmup 0.5 --duration 2 \
            --h2-max-streams 8 --max-host-connections 2 --assert-h2-multiplex \
            --output dist/bench-ci-netem.json
      - name: Compare blocklist performance against the PR base
        env:
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$POLICY_BASE_SHA"
          baseline="$RUNNER_TEMP/dnsp-policy-baseline"
          git worktree add --detach "$baseline" "$POLICY_BASE_SHA"
          make -C "$baseline" -f modern.mk dnsp-modern
          .bench-venv/bin/python bench/bench_policy.py --binary "$PWD/dnsp-modern" \
            --baseline-binary "$baseline/dnsp-modern" --baseline-commit "$POLICY_BASE_SHA" \
            --output dist/bench-ci-policy.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: dnsp-modern-benchmark-smoke
          path: |
            dist/bench-ci*.*
            dist/bench-ci-comparison/
          if-no-files-found: warn
          retention-days: 7

  system-resolver-comparison:
    name: Compare cached DoH, the OS DNS stub and direct UDP
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the resolver and fetch checksum-pinned peers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev python3-venv openssl iproute2
          test -x /usr/lib/systemd/systemd-resolved
          python3 -m venv .bench-venv
          .bench-venv/bin/python -m pip install -r ci/requirements-http2.txt
          make -f modern.mk dnsp-modern
          bench/fetch-comparison-peers.sh "$RUNNER_TEMP/comparison-peers"
      - name: Run the five DNS paths on the same host with loopback networking
        run: |
          sudo bench/compare-system-resolver.sh "$PWD/.bench-venv/bin/python" bench/compare_resolvers.py \
            --adguard "$RUNNER_TEMP/comparison-peers/dnsproxy" --dnscrypt "$RUNNER_TEMP/comparison-peers/dnscrypt-proxy" \
            --systemd-resolved /usr/lib/systemd/systemd-resolved --workloads miss hit --clients 1 8 32 \
            --runs 3 --warmup 0.5 --duration 3 --delay-ms 1 --output dist/system-resolver-comparison
          cat dist/system-resolver-comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: doh-system-resolver-comparison
          path: dist/system-resolver-comparison/
          if-no-files-found: warn
          retention-days: 14

  synthetic-h3:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select the dependency refresh window
        id: dependencies
        run: echo "epoch=$(( $(date -u +%s) / 604800 ))" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the Debian 13 benchmark image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: bench/Dockerfile.http3
          tags: dnsp-modern-h3-ci
          load: true
          pull: true
          no-cache-filters: tests
          cache-from: type=gha,scope=dnsp-h3-benchmark-amd64
          cache-to: type=gha,mode=max,scope=dnsp-h3-benchmark-amd64
          build-args: DEPENDENCY_EPOCH=${{ steps.dependencies.outputs.epoch }}
      - name: Verify HTTP/3 negotiation and TCP fallback
        run: docker run --rm --network none dnsp-modern-h3-ci /opt/bench/bin/python tests/test_http3.py --isolated
      - name: Diagnose HTTP/3 reuse against the PR base if integration fails
        if: failure() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          docker run --rm --network none dnsp-modern-h3-ci \
            /opt/bench/bin/python tests/test_http3.py Http3Tests.test_h3_opt_in_and_multiplex || true
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          baseline="$RUNNER_TEMP/dnsp-h3-baseline"
          git worktree add --detach "$baseline" "$BASE_SHA"
          docker run --rm --network none -v "$baseline:/baseline" dnsp-modern-h3-ci \
            sh -c 'make -C /baseline -f modern.mk dnsp-modern && DNSP_TEST_BINARY=/baseline/dnsp-modern /opt/bench/bin/python tests/test_http3.py Http3Tests.test_h3_opt_in_and_multiplex'
      - name: Compare HTTP/2 and HTTP/3 over an impaired upstream link
        run: |
          mkdir -p dist
          sudo modprobe sch_netem
          docker run --rm --network none --cap-add NET_ADMIN -v "$PWD/dist:/results" \
            dnsp-modern-h3-ci sh bench/netem.sh --isolated 5ms 0.5% /opt/bench/bin/python \
            --protocol h2-h3 --concurrency 16 --warmup 0.6 --duration 2 \
            --output /results/bench-ci-h2-h3-netem.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: dnsp-modern-h2-h3-netem
          path: dist/bench-ci-h2-h3-netem.*
          if-no-files-found: warn
          retention-days: 7

