name: DNSProxy modern - test and package

"on":
  pull_request:
  push:
    branches: [master]
    tags: ['v*-modern']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release from master
        type: boolean
        default: false
      release_version:
        description: Release version, for example 0.3.8 (blank uses VERSION)
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Superseded PR builds have no publication side effects. Release/manual runs
# keep independent groups and retain the existing per-tag publication lock.
concurrency:
  group: dnsp-modern-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DNSP_REQUIRE_IPV6: '1'

jobs:
  prepare-release:
    name: Prepare the manual release commit
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' &&
      inputs.publish && inputs.release_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - id: prepare
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: sh scripts/prepare-release.sh

  plan:
    needs: prepare-release
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
      commit: ${{ steps.plan.outputs.commit }}
      codeql: ${{ steps.pr.outputs.codeql }}
      fuzz: ${{ steps.pr.outputs.fuzz }}
      protocols: ${{ steps.pr.outputs.protocols }}
      windows: ${{ steps.pr.outputs.windows }}
      macos: ${{ steps.pr.outputs.macos }}
      measure_macos: ${{ steps.pr.outputs.measure_macos }}
      gui: ${{ steps.pr.outputs.gui }}
      containers: ${{ steps.pr.outputs.containers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare-release.outputs.commit || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - id: plan
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
          PREPARED_RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: sh scripts/ci-release-plan.sh
      - name: Test release planning and publication with a local Git remote
        if: github.event_name == 'pull_request'
        run: python3 tests/test_release.py
      - name: Test isolated parallel scheduling and error propagation
        if: github.event_name == 'pull_request'
        run: python3 tests/test_ci_parallel.py -v
      - name: Test portable desktop models and packaging rules
        if: github.event_name == 'pull_request'
        run: |
          python3 tests/test_gui_platforms.py -v
          python3 tests/test_gui_process.py -v
          python3 tests/test_gui_settings.py -v
          python3 tests/test_gui_telemetry.py -v
          python3 tests/test_gui_macos_launcher.py -v
          python3 tests/test_windows_gui_bundle.py -v
          python3 tests/test_gui_bootstrap.py -v
      - name: Select checks for the proposed merge
        id: pr
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          check_paths() {
            local check=$1 result=0
            shift
            git diff --quiet --no-ext-diff --no-renames HEAD^1 HEAD -- "$@" || result=$?
            case "$result" in
              0) printf '%s=false\n' "$check" >> "$GITHUB_OUTPUT" ;;
              1) printf '%s=true\n' "$check" >> "$GITHUB_OUTPUT" ;;
              *) return "$result" ;;
            esac
          }

          common=(dnsp-modern.c dnsp-platform.h dnsp-service.h dnsp-policy.h modern.mk VERSION .github/workflows/dnsp-modern.yml)
          check_paths codeql "${common[@]}" .github/workflows/codeql.yml
          check_paths fuzz "${common[@]}" tests/fuzz_dns.c tests/make_fuzz_corpus.py \
            tests/test_modern.py .github/workflows/dnsp-modern-fuzz.yml
          check_paths protocols "${common[@]}" ci/ bench/ tests/test_benchmark.py tests/test_http3.py \
            tests/test_modern.py .dockerignore .github/workflows/dnsp-modern-benchmark.yml
          check_paths windows "${common[@]}" bench/ tests/ packaging/windows/ docs/WINDOWS.md \
            scripts/build-windows.sh scripts/build-windows-installer.ps1 scripts/bundle-windows.py scripts/build-windows-gui-bundle.py packaging/windows/gui-bootstrap.py tools/desktop-gui/ scripts/run-windows-tests.py ci/ scripts/update-blocklist.py docs/BLOCKLISTS.md .github/workflows/dnsp-modern-windows.yml .github/workflows/dnsp-windows-gui.yml
          check_paths macos "${common[@]}" bench/ tests/ packaging/macos/ docs/MACOS.md \
            scripts/build-macos.sh scripts/measure-macos-build.py tools/desktop-gui/ scripts/update-blocklist.py docs/BLOCKLISTS.md docs/MACOS-GUI.md docs/DESKTOP-GUI.md .github/workflows/dnsp-modern-macos.yml
          check_paths measure_macos scripts/build-macos.sh scripts/measure-macos-build.py .github/workflows/dnsp-modern-macos.yml
          check_paths gui "${common[@]}" packaging/gui/ scripts/build-gui-deb.sh scripts/test-gui-package.py tools/desktop-gui/ tools/linux-gui/ 'tests/test_gui_*.py' \
            docs/LINUX-GUI.md docs/DESKTOP-GUI.md docs/MACOS-GUI.md docs/images/ scripts/build-windows-gui-bundle.py packaging/windows/ .github/workflows/dnsp-linux-gui-poc.yml .github/workflows/dnsp-windows-gui.yml
          check_paths containers "${common[@]}" ci/ Dockerfile .dockerignore compose.yaml packaging/container/ \
            tests/test_container.py tests/test_oci_bundle.py tests/test_oci_publish.py tests/test_modern.py tests/test_policy.py tests/test_http3.py \
            bench/ docs/CONTAINERS.md .github/workflows/dnsp-modern-container.yml

  deb:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: DEB ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            distro: ubuntu22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            distro: ubuntu22.04
            arch: arm64
          - runner: ubuntu-24.04
            distro: ubuntu24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            distro: ubuntu24.04
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev dpkg-dev python3
      - name: Build and inspect the package
        id: build
        env:
          BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          sh scripts/ci-build-deb.sh "${{ matrix.distro }}"
      - name: Exercise install, upgrade and purge with systemd
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: sudo sh scripts/test-deb-lifecycle.sh "$PACKAGE"
      - name: Verify the optional desktop package
        env:
          GUI_PACKAGE: ${{ steps.build.outputs.gui_package }}
        run: |
          sudo apt-get install -y --no-install-recommends "./$GUI_PACKAGE"
          /usr/bin/python3 scripts/test-gui-package.py
          sudo apt-get purge -y dnsp-modern-gui
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dnsp-modern-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.package }}
            ${{ steps.build.outputs.gui_upload }}
          if-no-files-found: error
          retention-days: 14

  debian:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: DEB debian13 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:13-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libcurl4-openssl-dev dpkg-dev python3 git ca-certificates openssl
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Build and inspect the package
        id: build
        env:
          BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          sh scripts/ci-build-deb.sh debian13
      - name: Verify the packaged binary installs and purges
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          apt-get install -y --no-install-recommends "./$PACKAGE"
          cmp dnsp-modern /usr/bin/dnsp-modern
          apt-get purge -y dnsp-modern
          test ! -e /usr/bin/dnsp-modern
      - name: Verify the optional desktop package
        env:
          GUI_PACKAGE: ${{ steps.build.outputs.gui_package }}
        run: |
          apt-get install -y --no-install-recommends "./$GUI_PACKAGE"
          /usr/bin/python3 scripts/test-gui-package.py
          apt-get purge -y dnsp-modern-gui
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dnsp-modern-debian13-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.package }}
            ${{ steps.build.outputs.gui_upload }}
          if-no-files-found: error
          retention-days: 14

  rpm:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: RPM rocky9 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: docker.io/rockylinux/rockylinux:9
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Install dependencies
        run: |
          # Allow a compatible package set while Rocky mirrors synchronize updates.
          dnf install -y --nobest gcc make git rpm-build redhat-rpm-config libcurl-devel openssl python3 systemd-rpm-macros
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Build and inspect the package
        id: build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test "$(rpm --eval '%{_arch}')" = "${{ matrix.arch }}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh scripts/build-rpm.sh
      - name: Install, query, and remove the RPM
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
          GUI_PACKAGE: ${{ steps.build.outputs.gui_package }}
          DNSP_TEST_BINARY: /usr/bin/dnsp-modern
        run: |
          dnf install -y --setopt=install_weak_deps=False "./$PACKAGE" "./$GUI_PACKAGE"
          /usr/bin/python3 scripts/test-gui-package.py
          python3 tests/test_modern.py Tests.test_udp Tests.test_tcp
          dnf remove -y dnsp-modern-gui dnsp-modern
          test ! -e /usr/bin/dnsp-modern
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dnsp-modern-rocky9-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.package }}
            ${{ steps.build.outputs.gui_upload }}
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev python3
      - name: Sanitizer integration test suite
        env:
          # Keep sanitizer findings fatal, with useful UBSan stack traces.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          DNSP_TEST_STARTUP_TIMEOUT: '12'
          DNSP_REQUIRE_IPV6: '1'
        run: |
          make -B -f modern.mk modern-check CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"

  ipv4-only:
    name: IPv4-only host regression
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev python3 iproute2 util-linux
      - name: Build the portable resolver
        run: make -f modern.mk dnsp-modern
      - name: Exercise an IPv4-only host and strict IPv6 rejection
        run: |
          # These network settings apply only inside this temporary namespace.
          sudo unshare --net sh -eu <<'SH'
          sysctl -qw net.ipv6.conf.all.disable_ipv6=1 net.ipv6.conf.default.disable_ipv6=1
          ip link set lo up
          unset DNSP_REQUIRE_IPV6
          python3 tests/test_host_capabilities.py
          python3 tests/test_modern.py Tests.test_udp Tests.test_tcp
          python3 tests/test_policy.py
          python3 tests/test_ipv6.py
          strict_log=$(mktemp)
          trap 'rm -f "$strict_log"' 0
          if DNSP_REQUIRE_IPV6=1 python3 tests/test_ipv6.py >"$strict_log" 2>&1; then
              echo 'Required IPv6 unexpectedly passed on an IPv4-only host' >&2
              exit 1
          fi
          grep -F 'IPv6 loopback is required by DNSP_REQUIRE_IPV6=1' "$strict_log"
          SH

  codeql:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      github.event_name == 'pull_request' && needs.plan.outputs.codeql == 'true'
    permissions:
      actions: read
      checks: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  fuzz:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      github.event_name == 'pull_request' && needs.plan.outputs.fuzz == 'true'
    uses: ./.github/workflows/dnsp-modern-fuzz.yml

  protocols:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      github.event_name == 'pull_request' && needs.plan.outputs.protocols == 'true'
    uses: ./.github/workflows/dnsp-modern-benchmark.yml

  windows:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || needs.plan.outputs.windows == 'true')
    uses: ./.github/workflows/dnsp-modern-windows.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  macos:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || needs.plan.outputs.macos == 'true')
    uses: ./.github/workflows/dnsp-modern-macos.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      measure_build: ${{ needs.plan.outputs.measure_macos == 'true' }}

  gui-runtime:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || needs.plan.outputs.windows == 'true')
    uses: ./.github/workflows/dnsp-windows-gui.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      stage: runtime

  windows-gui:
    needs: [plan, windows, gui-runtime]
    if: >-
      !cancelled() && needs.windows.result == 'success' && needs.gui-runtime.result == 'success'
    uses: ./.github/workflows/dnsp-windows-gui.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      stage: installer

  gui:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      github.event_name == 'pull_request' && needs.plan.outputs.gui == 'true'
    uses: ./.github/workflows/dnsp-linux-gui-poc.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  containers:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || needs.plan.outputs.containers == 'true')
    uses: ./.github/workflows/dnsp-modern-container.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  pr-checks:
    name: DNSProxy PR checks
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [plan, deb, debian, rpm, sanitizers, ipv4-only, codeql, fuzz, protocols, windows, macos, gui, gui-runtime, windows-gui, containers]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Verify PR check results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          planned = jobs["plan"]["outputs"]
          optional = {"codeql", "fuzz", "protocols", "windows", "macos", "gui", "gui-runtime", "windows-gui", "containers"}
          failed = []
          for name, job in sorted(jobs.items()):
              selected = planned.get("windows") if name in {"gui-runtime", "windows-gui"} else planned.get(name)
              expected = "skipped" if name in optional and selected == "false" else "success"
              result = job["result"]
              print(f"{name}: {result} (expected {expected})")
              if result != expected:
                  failed.append(name)
          if failed:
              sys.exit("PR checks failed: " + ", ".join(failed))
          PY

  publish:
    name: Publish the tested package set
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.plan.result == 'success' && needs.deb.result == 'success' &&
      needs.debian.result == 'success' && needs.rpm.result == 'success' &&
      needs.sanitizers.result == 'success' && needs.ipv4-only.result == 'success' &&
      needs.windows.result == 'success' && needs.windows-gui.result == 'success' && needs.macos.result == 'success' &&
      needs.containers.result == 'success' &&
      (needs.plan.outputs.mode == 'master' || needs.plan.outputs.mode == 'tag' || needs.plan.outputs.mode == 'manual')
    needs: [plan, deb, debian, rpm, sanitizers, ipv4-only, windows, windows-gui, macos, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: dnsp-modern-release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dnsp-modern-*
          merge-multiple: true
          path: release-assets
      - name: Publish Linux packages, Windows installers and ZIPs, macOS archives, and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ needs.plan.outputs.mode }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: bash scripts/publish-modern.sh release-assets

  publish-container:
    name: Publish the tested OCI image to GHCR
    needs: [plan, containers, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.containers.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: dnsp-modern-container-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dnsp-oci-image
          path: oci-release
      - name: Verify the release and publish its exact tested image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          OCI_DIGEST: ${{ needs.containers.outputs.digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq 'if (.isDraft or .isPrerelease) then error("A stable published release is required") else . end'
          (cd oci-release && sha256sum -c dnsp-modern-linux.oci.tar.sha256)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          authfile="$RUNNER_TEMP/ghcr-auth.json"
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$authfile" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 packaging/container/publish.py oci-release/dnsp-modern-linux.oci.tar \
            --repository "$image" --revision "$RELEASE_COMMIT" --version "$(cat VERSION)" \
            --digest "$OCI_DIGEST" --authfile "$authfile" --staging-tag "build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo '### Published OCI image'
            echo "\`$image:$(cat VERSION)\`"
            echo "\`$image@$OCI_DIGEST\`"
            echo 'On first publication, the owner must set the GHCR package visibility to Public to allow anonymous pulls. See docs/CONTAINERS.md.'
          } >> "$GITHUB_STEP_SUMMARY"

