name: DNSProxy modern - test and package

"on":
  pull_request:
  push:
    branches: [master]
    tags: ['v*-modern']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current master VERSION if it is new
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
      commit: ${{ steps.plan.outputs.commit }}
      codeql: ${{ steps.pr.outputs.codeql }}
      fuzz: ${{ steps.pr.outputs.fuzz }}
      protocols: ${{ steps.pr.outputs.protocols }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - id: plan
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        run: sh scripts/ci-release-plan.sh
      - name: Select checks for the proposed merge
        id: pr
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          check_paths() {
            local check=$1 result=0
            shift
            git diff --quiet --no-ext-diff --no-renames HEAD^1 HEAD -- "$@" || result=$?
            case "$result" in
              0) printf '%s=false\n' "$check" >> "$GITHUB_OUTPUT" ;;
              1) printf '%s=true\n' "$check" >> "$GITHUB_OUTPUT" ;;
              *) return "$result" ;;
            esac
          }

          common=(dnsp-modern.c modern.mk VERSION .github/workflows/dnsp-modern.yml)
          check_paths codeql "${common[@]}" .github/workflows/codeql.yml
          check_paths fuzz "${common[@]}" tests/fuzz_dns.c tests/make_fuzz_corpus.py \
            tests/test_modern.py .github/workflows/dnsp-modern-fuzz.yml
          check_paths protocols "${common[@]}" bench/ tests/test_benchmark.py tests/test_http3.py \
            tests/test_modern.py .github/workflows/dnsp-modern-benchmark.yml

  deb:
    needs: plan
    name: DEB ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            distro: ubuntu22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            distro: ubuntu22.04
            arch: arm64
          - runner: ubuntu-24.04
            distro: ubuntu24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            distro: ubuntu24.04
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev dpkg-dev python3
      - name: Build and inspect the package
        id: build
        env:
          BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          sh scripts/ci-build-deb.sh "${{ matrix.distro }}"
      - name: Exercise install, upgrade and purge with systemd
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: sudo sh scripts/test-deb-lifecycle.sh "$PACKAGE"
      - uses: actions/upload-artifact@v6
        with:
          name: dnsp-modern-${{ matrix.distro }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
          retention-days: 14

  debian:
    needs: plan
    name: DEB debian13 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:13-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libcurl4-openssl-dev dpkg-dev python3 git ca-certificates openssl
      - uses: actions/checkout@v5
      - name: Build and inspect the package
        id: build
        env:
          BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          sh scripts/ci-build-deb.sh debian13
      - name: Verify the packaged binary installs and purges
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          apt-get install -y --no-install-recommends "./$PACKAGE"
          cmp dnsp-modern /usr/bin/dnsp-modern
          apt-get purge -y dnsp-modern
          test ! -e /usr/bin/dnsp-modern
      - uses: actions/upload-artifact@v6
        with:
          name: dnsp-modern-debian13-${{ matrix.arch }}
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
          retention-days: 14

  rpm:
    needs: plan
    name: RPM rocky9 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: quay.io/rockylinux/rockylinux:9
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Install dependencies
        run: |
          dnf install -y gcc make git rpm-build redhat-rpm-config libcurl-devel openssl python3 systemd-rpm-macros
      - uses: actions/checkout@v5
      - name: Build and inspect the package
        id: build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test "$(rpm --eval '%{_arch}')" = "${{ matrix.arch }}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh scripts/build-rpm.sh
      - name: Install, query, and remove the RPM
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
          DNSP_TEST_BINARY: /usr/bin/dnsp-modern
        run: |
          dnf install -y "./$PACKAGE"
          python3 tests/test_modern.py Tests.test_udp Tests.test_tcp
          dnf remove -y dnsp-modern
          test ! -e /usr/bin/dnsp-modern
      - uses: actions/upload-artifact@v6
        with:
          name: dnsp-modern-rocky9-${{ matrix.arch }}
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev python3
      - name: Sanitizer integration test suite
        env:
          # Keep sanitizer findings fatal, with useful UBSan stack traces.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          DNSP_TEST_STARTUP_TIMEOUT: '12'
        run: |
          make -B -f modern.mk modern-check CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"

  codeql:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.codeql == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  fuzz:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.fuzz == 'true'
    uses: ./.github/workflows/dnsp-modern-fuzz.yml

  protocols:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.protocols == 'true'
    uses: ./.github/workflows/dnsp-modern-benchmark.yml

  pr-checks:
    name: DNSProxy PR checks
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [plan, deb, debian, rpm, sanitizers, codeql, fuzz, protocols]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Verify PR check results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          planned = jobs["plan"]["outputs"]
          optional = {"codeql", "fuzz", "protocols"}
          failed = []
          for name, job in sorted(jobs.items()):
              expected = "skipped" if name in optional and planned.get(name) == "false" else "success"
              result = job["result"]
              print(f"{name}: {result} (expected {expected})")
              if result != expected:
                  failed.append(name)
          if failed:
              sys.exit("PR checks failed: " + ", ".join(failed))
          PY

  publish:
    name: Publish the tested package set
    if: >-
      github.event_name != 'pull_request' &&
      (needs.plan.outputs.mode == 'master' || needs.plan.outputs.mode == 'tag')
    needs: [plan, deb, debian, rpm, sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: dnsp-modern-release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/download-artifact@v7
        with:
          pattern: dnsp-modern-*
          merge-multiple: true
          path: release-assets
      - name: Publish DEBs, RPMs, and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ needs.plan.outputs.mode }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: bash scripts/publish-modern.sh release-assets
