name: DNSProxy modern - test and package

"on":
  pull_request:
  push:
    branches: [master]
    tags: ['v*-modern']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release from master
        type: boolean
        default: false
      release_version:
        description: Release version, for example 0.3.8 (blank uses VERSION)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare the manual release commit
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' &&
      inputs.publish && inputs.release_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: prepare
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: sh scripts/prepare-release.sh

  plan:
    needs: prepare-release
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
      commit: ${{ steps.plan.outputs.commit }}
      codeql: ${{ steps.pr.outputs.codeql }}
      fuzz: ${{ steps.pr.outputs.fuzz }}
      protocols: ${{ steps.pr.outputs.protocols }}
      windows: ${{ steps.pr.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.commit || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - id: plan
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
          PREPARED_RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: sh scripts/ci-release-plan.sh
      - name: Test release planning and publication with a local Git remote
        if: github.event_name == 'pull_request'
        run: python3 tests/test_release.py
      - name: Select checks for the proposed merge
        id: pr
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          check_paths() {
            local check=$1 result=0
            shift
            git diff --quiet --no-ext-diff --no-renames HEAD^1 HEAD -- "$@" || result=$?
            case "$result" in
              0) printf '%s=false\n' "$check" >> "$GITHUB_OUTPUT" ;;
              1) printf '%s=true\n' "$check" >> "$GITHUB_OUTPUT" ;;
              *) return "$result" ;;
            esac
          }

          common=(dnsp-modern.c dnsp-platform.h modern.mk VERSION .github/workflows/dnsp-modern.yml)
          check_paths codeql "${common[@]}" .github/workflows/codeql.yml
          check_paths fuzz "${common[@]}" tests/fuzz_dns.c tests/make_fuzz_corpus.py \
            tests/test_modern.py .github/workflows/dnsp-modern-fuzz.yml
          check_paths protocols "${common[@]}" bench/ tests/test_benchmark.py tests/test_http3.py \
            tests/test_modern.py .github/workflows/dnsp-modern-benchmark.yml
          check_paths windows "${common[@]}" bench/ tests/ packaging/windows/ docs/WINDOWS.md \
            scripts/build-windows.sh scripts/bundle-windows.py .github/workflows/dnsp-modern-windows.yml

  deb:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: DEB ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            distro: ubuntu22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            distro: ubuntu22.04
            arch: arm64
          - runner: ubuntu-24.04
            distro: ubuntu24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            distro: ubuntu24.04
            arch: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev dpkg-dev python3
      - name: Build and inspect the package
        id: build
        env:
          BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          sh scripts/ci-build-deb.sh "${{ matrix.distro }}"
      - name: Exercise install, upgrade and purge with systemd
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: sudo sh scripts/test-deb-lifecycle.sh "$PACKAGE"
      - uses: actions/upload-artifact@v6
        with:
          name: dnsp-modern-${{ matrix.distro }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
          retention-days: 14

  debian:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: DEB debian13 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:13-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libcurl4-openssl-dev dpkg-dev python3 git ca-certificates openssl
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Build and inspect the package
        id: build
        env:
          BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          sh scripts/ci-build-deb.sh debian13
      - name: Verify the packaged binary installs and purges
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          apt-get install -y --no-install-recommends "./$PACKAGE"
          cmp dnsp-modern /usr/bin/dnsp-modern
          apt-get purge -y dnsp-modern
          test ! -e /usr/bin/dnsp-modern
      - uses: actions/upload-artifact@v6
        with:
          name: dnsp-modern-debian13-${{ matrix.arch }}
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
          retention-days: 14

  rpm:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: RPM rocky9 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: docker.io/rockylinux/rockylinux:9
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Install dependencies
        run: |
          # Allow a compatible package set while Rocky mirrors synchronize updates.
          dnf install -y --nobest gcc make git rpm-build redhat-rpm-config libcurl-devel openssl python3 systemd-rpm-macros
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Build and inspect the package
        id: build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test "$(rpm --eval '%{_arch}')" = "${{ matrix.arch }}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh scripts/build-rpm.sh
      - name: Install, query, and remove the RPM
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
          DNSP_TEST_BINARY: /usr/bin/dnsp-modern
        run: |
          dnf install -y "./$PACKAGE"
          python3 tests/test_modern.py Tests.test_udp Tests.test_tcp
          dnf remove -y dnsp-modern
          test ! -e /usr/bin/dnsp-modern
      - uses: actions/upload-artifact@v6
        with:
          name: dnsp-modern-rocky9-${{ matrix.arch }}
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev python3
      - name: Sanitizer integration test suite
        env:
          # Keep sanitizer findings fatal, with useful UBSan stack traces.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          DNSP_TEST_STARTUP_TIMEOUT: '12'
          DNSP_REQUIRE_IPV6: '1'
        run: |
          make -B -f modern.mk modern-check CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"

  codeql:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      github.event_name == 'pull_request' && needs.plan.outputs.codeql == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  fuzz:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      github.event_name == 'pull_request' && needs.plan.outputs.fuzz == 'true'
    uses: ./.github/workflows/dnsp-modern-fuzz.yml

  protocols:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      github.event_name == 'pull_request' && needs.plan.outputs.protocols == 'true'
    uses: ./.github/workflows/dnsp-modern-benchmark.yml

  windows:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || needs.plan.outputs.windows == 'true')
    uses: ./.github/workflows/dnsp-modern-windows.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  pr-checks:
    name: DNSProxy PR checks
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [plan, deb, debian, rpm, sanitizers, codeql, fuzz, protocols, windows]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Verify PR check results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          planned = jobs["plan"]["outputs"]
          optional = {"codeql", "fuzz", "protocols", "windows"}
          failed = []
          for name, job in sorted(jobs.items()):
              expected = "skipped" if name in optional and planned.get(name) == "false" else "success"
              result = job["result"]
              print(f"{name}: {result} (expected {expected})")
              if result != expected:
                  failed.append(name)
          if failed:
              sys.exit("PR checks failed: " + ", ".join(failed))
          PY

  publish:
    name: Publish the tested package set
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.plan.result == 'success' && needs.deb.result == 'success' &&
      needs.debian.result == 'success' && needs.rpm.result == 'success' &&
      needs.sanitizers.result == 'success' && needs.windows.result == 'success' &&
      (needs.plan.outputs.mode == 'master' || needs.plan.outputs.mode == 'tag' || needs.plan.outputs.mode == 'manual')
    needs: [plan, deb, debian, rpm, sanitizers, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: dnsp-modern-release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/download-artifact@v7
        with:
          pattern: dnsp-modern-*
          merge-multiple: true
          path: release-assets
      - name: Publish DEBs, RPMs, Windows ZIP, and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ needs.plan.outputs.mode }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: bash scripts/publish-modern.sh release-assets
