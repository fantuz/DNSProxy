name: DNSProxy modern - test and package

"on":
  pull_request:
  push:
    branches: [master]
    tags: ['v*-modern']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Build and test (${{ matrix.distro }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            distro: ubuntu22.04
          - runner: ubuntu-24.04
            distro: ubuntu24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev dpkg-dev python3
      - name: Build and inspect the package
        id: build
        run: sh scripts/ci-build-deb.sh "${{ matrix.distro }}"
      - name: Exercise install, upgrade and purge with systemd
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: sudo sh scripts/test-deb-lifecycle.sh "$PACKAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: dnsp-modern-${{ matrix.distro }}
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
          retention-days: 14

  debian:
    name: Build and install (debian13)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libcurl4-openssl-dev dpkg-dev python3 git ca-certificates openssl
      - uses: actions/checkout@v5
      - name: Build and inspect the package
        id: build
        run: sh scripts/ci-build-deb.sh debian13
      - name: Verify the packaged binary installs and purges
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          apt-get install -y --no-install-recommends "./$PACKAGE"
          cmp dnsp-modern /usr/bin/dnsp-modern
          apt-get purge -y dnsp-modern
          test ! -e /usr/bin/dnsp-modern
      - uses: actions/upload-artifact@v4
        with:
          name: dnsp-modern-debian13
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev python3
      - name: Sanitizer integration test suite
        env:
          # Keep sanitizer findings fatal, with useful UBSan stack traces.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          DNSP_TEST_STARTUP_TIMEOUT: '12'
        run: |
          make -B -f modern.mk modern-check CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"

  publish:
    name: Publish pre-release from version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, debian, sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dnsp-modern-*
          merge-multiple: true
          path: dist
      - name: Publish distro-specific DEBs and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb' | sort)
          if (( ${#packages[@]} != 3 )); then
            echo "Expected three distribution-specific packages, found ${#packages[@]}" >&2
            exit 1
          fi
          for distro in ubuntu22.04 ubuntu24.04 debian13; do
            matches=(dist/*+"$distro"_*.deb)
            if (( ${#matches[@]} != 1 )) || [[ ! -f "${matches[0]}" ]]; then
              echo "Expected one package for $distro, found ${#matches[@]}" >&2
              exit 1
            fi
          done
          (cd dist && sha256sum *.deb > SHA256SUMS && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "${packages[@]}" dist/SHA256SUMS \
            --title "DNSProxy Modern ${GITHUB_REF_NAME} (experimental)" \
            --prerelease --generate-notes
