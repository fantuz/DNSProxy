name: DNSProxy Linux desktop monitor

"on":
  push:
    branches: [codex/linux-gui-poc, master]
    paths:
      - tools/desktop-gui/**
      - tools/linux-gui/**
      - tests/test_gui_*.py
      - docs/LINUX-GUI.md
      - .github/workflows/dnsp-linux-gui-poc.yml
      - dnsp-modern.c
      - dnsp-platform.h
      - dnsp-policy.h
      - modern.mk
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: linux-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gui:
    name: GTK 4 · ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install native Linux dependencies
        run: |
          sudo sh scripts/ci-install-ubuntu.sh --no-install-recommends \
            build-essential pkg-config libcurl4-openssl-dev \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 python3-venv \
            xvfb xauth dbus-x11 imagemagick desktop-file-utils
      - name: Check formatting and imports for the optional GUI
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/gui-lint"
          "$RUNNER_TEMP/gui-lint/bin/pip" install ruff==0.14.4
          "$RUNNER_TEMP/gui-lint/bin/ruff" format --diff tools/desktop-gui tests/test_gui_*.py
          "$RUNNER_TEMP/gui-lint/bin/ruff" check --select E4,E7,E9,F tools/desktop-gui tests/test_gui_*.py
          git diff --check
      - name: Build the resolver and install the optional desktop package
        run: |
          make dnsp-modern
          sh scripts/build-gui-deb.sh "$(cat VERSION)"
          sudo apt-get install -y --no-install-recommends ./dist/dnsp-modern-gui_*_all.deb
          /usr/bin/python3 scripts/test-gui-package.py
          desktop-file-validate packaging/gui/org.dnsproxy.LinuxMonitor.desktop
          DNSP_GUI_SOURCE=/usr/share/dnsp-modern-gui /usr/bin/python3 tests/test_gui_chart.py
          DNSP_GUI_SOURCE=/usr/share/dnsp-modern-gui /usr/bin/python3 tests/test_gui_monitor.py
          DNSP_GUI_SOURCE=/usr/share/dnsp-modern-gui /usr/bin/python3 tests/test_gui_platforms.py
          DNSP_GUI_SOURCE=/usr/share/dnsp-modern-gui /usr/bin/python3 tests/test_gui_process.py
          DNSP_GUI_SOURCE=/usr/share/dnsp-modern-gui /usr/bin/python3 tests/test_gui_settings.py
          DNSP_GUI_SOURCE=/usr/share/dnsp-modern-gui /usr/bin/python3 tests/test_gui_telemetry.py
      - name: Test GTK with real incoming DNS queries and save screenshots
        env:
          DNSP_GUI_SOURCE: /usr/share/dnsp-modern-gui
          GUI_SCREENSHOTS: ${{ github.workspace }}/dist/gui-screenshots
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x960x24' \
            /usr/bin/python3 tests/test_gui_gtk.py
          DNSP_GUI_SOURCE=/usr/share/dnsp-modern-gui dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1100x24' \
            /usr/bin/python3 tests/test_gui_native.py --binary "$PWD/dnsp-modern" --artifacts "$PWD/dist/gui-native-linux"
      - name: Bundle the desktop monitor sources
        if: always()
        run: |
          mkdir -p dist
          tar -czf dist/dnsp-linux-gui-poc.tar.gz --exclude=__pycache__ \
            tools/desktop-gui docs/LINUX-GUI.md docs/images/linux-gui-poc-*.png
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: linux-gui-poc-${{ matrix.runner }}
          path: |
            dist/dnsp-linux-gui-poc.tar.gz
            dist/gui-screenshots/*.png
            dist/gui-native-linux/
          if-no-files-found: error

