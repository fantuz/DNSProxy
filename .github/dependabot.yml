version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    groups:
      protocol-fixtures:
        patterns: ["*"]
        update-types: [minor, patch]
